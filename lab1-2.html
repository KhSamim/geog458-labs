<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
   </style>
</head>
<body>
   <div id='map'></div>
   <script>
      mapboxgl.accessToken = 'pk.eyJ1Ijoic2FtaW1qYW4iLCJhIjoiY211enZrejh5MDAxMjJ3cHlrcHp4dWtjNCJ9.nwHMRm59fzQVz6ABY9paEw';
      const mymap = new mapboxgl.Map({
             container: 'map',
             style: 'mapbox://styles/mapbox/standard-satellite',
             projection: 'albers', //Display the map as a globe since satellite-v9 defaults to Mercator
             //I changed these coordinates to the latitude and longitude of UW seattle so it shows UW Seattle
             center: [-122.3035, 47.6553],
             //I think zooming it to 15 shows UW seattle clear enough
             zoom:15,
          });

        
        mymap.on('style.load', () => {

            // PROPERTY 1: Changes the map lighting to dawn.
            // Useful for creating any atmosphere and visual contrast you want.
            mymap.setConfigProperty('basemap', 'lightPreset', 'dawn');

            // Hides points of interest, like businesses and attraction labels.
            // This reduces clutter and helps the viewer focus on the campus.
            mymap.setConfigProperty('basemap','showPointOfInterestLabels',false);

            // PROPERTY 2: Hides transit icons and text labels.
            // Useful because transit information is not the main focus of the map.
            mymap.setConfigProperty('basemap','showTransitLabels',false );

            // PROPERTY 3: Changes the map label font to Open Sans.
            // Useful for creating a readable style for place labels.
            mymap.setConfigProperty('basemap','font','Roboto');
        });

        //Property 1: ShowTransitLabels
        // I set showTransitLabels to false to hide transit icons and text labels on the map. 
        // This reduces visual clutter and helps the viewer focus on the University of Washington 
        // campus instead of transportation information. This is useful when making a campus map 
        // where transit information is not the main focus.

        // Adds a button that lets users expand the map to fullscreen.
        mymap.addControl(new mapboxgl.FullscreenControl());

        //Property 3: Font
        // I set the font property to Open Sans to change the font used for map labels.
        //  I chose this setting because a consistent and readable font can make the map easier to understand. 
        // This would be useful for a campus map where viewers need to identify places and read labels clearly.
        
        // Adds zoom buttons and a compass for navigating the map.
        mymap.addControl(new mapboxgl.NavigationControl());

</script>
</body>
</html>

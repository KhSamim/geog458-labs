<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Mapping World Cities</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

         /* Layout of the legend panel. */
        #legend {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 140px;
            background: #fff;
            margin-right: 20px;
            margin-bottom: 40px;
            padding: 10px 20px 10px 10px;
            border-radius: 3px;
            text-align: center;
        }

        /* Each row for a magnitude value. */
        .break {
            position: relative;
            margin: 0;
            padding: 0;
        }

        /* The circular symbol. */
        .dot {
            display: inline-block;
            margin-top: 5px;
            border-radius: 50%;
            opacity: 0.6;
        }

        /* Label next to the symbol. */
        .dot-label {
            font-style: italic;
        }

        /* Link color within the legend. */
        #legend a {
            color: black;
        }

        /* Layout of the title panel. */
        #title {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1;
            max-width: 320px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 5px;
            font-family: Arial, sans-serif;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
        }
        
        #title h1 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        #title p {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="title">
        <h1>World Cities by Population</h1>
        <p>
            This map shows cities around the world. Larger and darker circles
            represent larger populations. Click a city to view its population.
        </p>
    </div>
    </div>
    <div id="legend"></div>
    <script>    
        const legend = document.getElementById('legend');
        const grades = [15000, 100000, 1000000, 5000000, 15000000];
        const radii = [3, 5, 9, 15, 22];
        const colors = ['#fff7d6', 
        '#fee8a8',
        '#fdb863',
        '#e66101',
        '#b2182b'];
        const labels = ['<strong>Population</strong>'];

        for (let i = 0; i < grades.length; i++) {
            const value = grades[i];
            const diameter = 2 * radii[i];

            labels.push(
                '<p class="break"><i class="dot" style="background:' + colors[i] +
                '; width:' + diameter + 'px; height:' + diameter +
                'px;"></i> <span class="dot-label" style="top:' +
                diameter / 2 + 'px;">' + value + '</span></p>'
            );
        }

        const source =
            '<p style="text-align:right; font-size:10pt;">Source: ' +
            '<a href="https://earthquake.usgs.gov/earthquakes/">USGS</a></p>';

        legend.innerHTML = labels.join('') + source;
    </script>
    
    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoic2FtaW1qYW4iLCJhIjoiY211enZrejh5MDAxMjJ3cHlrcHp4dWtjNCJ9.nwHMRm59fzQVz6ABY9paEw';
        const mymap = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-v9',
            projection: 'globe',
            center: [-96, 37.8],
            zoom: 1
        });

        mymap.on('style.load', () => {
            mymap.setFog({});
        });

        //loaded the map and added a source and layer for the population of world cities
        mymap.on('load', () => {
            mymap.addSource('population', {
                type: 'geojson',
                data: 'data/world-cities.geojson'
            });
            
            // Add a layer showing the population of the cities.
            // The radius and color of the circle are based on the population value.
            // smaller population values will have smaller circles and lighter colors, 
            // while larger population values will have larger circles and darker colors.
            mymap.addLayer({
                id: 'cities-layer',
                type: 'circle',
                source: 'population',
                paint: {
                    // Make the circle radius larger as population increases.
                    'circle-radius': [
                        'interpolate',
                        ['linear'],
                        ['get', 'population'],
                        15000, 3,
                        100000, 5,
                        1000000, 9,
                        5000000, 15,
                        15000000, 22
                    ],
                     // Change the circle color as population increases.
                    'circle-color': [
                        'interpolate', ['linear'],
                        ['to-number', ['get', 'population'], 0],
                        15000, '#fff7d6',
                        100000, '#fee8a8',
                        1000000, '#fdb863',
                        5000000, '#e66101',
                        15000000, '#b2182b'
                    ],
                    'circle-stroke-color': 'white'
                }
                
            });

            // Click a city circle to view its population.
            mymap.on('click', 'cities-layer', (event) => {
                const feature = event.features[0];
                const properties = feature.properties;
                const coordinates = feature.geometry.coordinates.slice();

                const city = properties.city || 'Unknown city';
                const country = properties.country || 'Not available';
                const population = Number(properties.population);

                const formattedPopulation = Number.isFinite(population)
                    ? population.toLocaleString('en-US')
                    : 'Not available';

                new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(
                        `<strong>${city}</strong><br>
                        <strong>Country:</strong> ${country}<br>
                        <strong>Population:</strong> ${formattedPopulation}`
                    )
                    .addTo(mymap);
            });
            
        });

        

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 3: Metro Flex Coverage in King County</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">

  <style>
    body {
      margin: 0;
      font: 14px/1.5 Arial, sans-serif;
      color: #182e3a;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 16px;
      width: 260px;
      max-width: calc(100% - 100px);
      background: white;
      max-height: calc(100% - 80px);
      overflow: auto;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.15);
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    p {
      margin: 8px 0;
    }

    .legend-swatch {
      height: 14px;
      background: #2A9D8F;
      border: 1px solid #146B68;
    }

    .maplibregl-popup-content {
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <section id="panel">
    <h1>Metro Flex Coverage in King County</h1>
    <p>Source: King County Metro Flex service areas</p>
    <p id="status">
      Explore Metro Flex service areas. Click an area to see its name.
    </p>

    <div id="legend">
      <p><strong>Metro Flex service coverage</strong></p>
      <div class="legend-swatch"></div>
      <p>
        Colored areas indicate Metro Flex service coverage,
        not ridership or service frequency.
      </p>
    </div>
  </section>

  <script type="module">
    import * as maplibregl from
      'https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
      container: 'map',

      style: {
        version: 8,
        sources: {},
        layers: [
          {
            id: 'background',
            type: 'background',
            paint: {
              'background-color': '#edf1f0'
            }
          }
        ]
      },

      center: [-122.20, 47.48],
      zoom: 9,
      minZoom: 8,
      maxZoom: 12,

      // Keep the map within the wider Puget Sound / King County area.
      maxBounds: [
        [-123.0, 46.9],
        [-121.5, 48.2]
      ]
    });

    // Add zoom and scale controls.
    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(
      new maplibregl.ScaleControl({ unit: 'metric' }),
      'bottom-left'
    );

    map.on('error', (event) => {
      console.error('Map error:', event.error);

      document.getElementById('status').textContent =
        'A map layer failed to load. Check the browser Console (F12).';
    });

    map.on('load', () => {


      map.addSource('independent-basemap', {
        type: 'raster',
        tiles: [
          'Assets/Mapbox-ind/mapbox-independent/{z}/{x}/{y}.png'
        ],
        tileSize: 256,
        minzoom: 8,
        maxzoom: 12
      });

      map.addLayer({
        id: 'independent-basemap-layer',
        type: 'raster',
        source: 'independent-basemap'
      });

      map.addSource('metro-flex-coverage', {
        type: 'raster',
        tiles: [
          'Assets/metro-flex-coverage/{z}/{x}/{y}.png'
        ],
        tileSize: 256,
        minzoom: 8,
        maxzoom: 12
      });

      map.addLayer({
        id: 'metro-flex-coverage-layer',
        type: 'raster',
        source: 'metro-flex-coverage',
        paint: {
          'raster-opacity': 0.65
        }
      });

      map.addSource('metro-flex-data', {
        type: 'geojson',
        data: 'Data/metro_flex.geojson'
      });

      map.addLayer({
        id: 'metro-flex-areas',
        type: 'fill',
        source: 'metro-flex-data',
        paint: {
          'fill-color': '#2A9D8F',
          'fill-opacity': 0.18
        }
      });

      map.addLayer({
        id: 'metro-flex-outlines',
        type: 'line',
        source: 'metro-flex-data',
        paint: {
          'line-color': '#146B68',
          'line-width': 1.5
        }
      });

      map.on('click', 'metro-flex-areas', (event) => {
        const feature = event.features[0];

        const areaName =
          feature.properties.name || 'Unknown service area';

        new maplibregl.Popup()
          .setLngLat(event.lngLat)
          .setText('Metro Flex service area: ' + areaName)
          .addTo(map);
      });

      console.log('Metro Flex map layers have been added.');
    });
  </script>
</body>
</html>
